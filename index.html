<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch 2 Price Watch</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #e60012;
    --text: #f2f2f2;
    --muted: #9aa0ab;
    --good: #35d07f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 16px 12px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 12px 16px;
    flex-wrap: wrap;
  }
  select, input {
    background: var(--card);
    color: var(--text);
    border: 1px solid #2a2e37;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    padding: 8px 16px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid #22262f;
  }
  .card .store {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card h3 {
    margin: 0;
    font-size: 1rem;
    line-height: 1.3;
  }
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .price {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--good);
  }
  .original {
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: line-through;
  }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    width: fit-content;
  }
  .lowest-badge {
    display: inline-block;
    background: var(--good);
    color: #0f1115;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    width: fit-content;
  }
  .card a.buy {
    margin-top: auto;
    text-align: center;
    background: #262a33;
    color: var(--text);
    text-decoration: none;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .card a.buy:hover { background: #30353f; }
  #empty, #updated {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>🎮 Switch 2 Price Watch</h1>
  <p>Monitoramento automático de preços de jogos de Nintendo Switch 2</p>
</header>

<div id="controls">
  <select id="storeFilter">
    <option value="">Todas as lojas</option>
  </select>
  <select id="sortBy">
    <option value="discount">Maior desconto</option>
    <option value="price">Menor preço</option>
    <option value="name">Nome (A-Z)</option>
  </select>
  <input id="search" type="text" placeholder="Buscar jogo...">
</div>

<p id="updated"></p>
<div id="grid"></div>
<p id="empty" style="display:none;">Nenhum jogo encontrado. O primeiro scraping ainda pode não ter rodado.</p>

<script>
async function main() {
  const res = await fetch('data/prices.json', { cache: 'no-store' });
  const data = await res.json();
  const games = Object.values(data.games || {});

  const updatedEl = document.getElementById('updated');
  if (data.last_updated) {
    const d = new Date(data.last_updated);
    updatedEl.textContent = 'Última atualização: ' + d.toLocaleString('pt-BR');
  } else {
    updatedEl.textContent = 'Ainda sem dados coletados.';
  }

  const storeFilter = document.getElementById('storeFilter');
  const stores = [...new Set(games.map(g => g.store))].sort();
  stores.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    storeFilter.appendChild(opt);
  });

  function latest(game) {
    const h = game.history || [];
    return h[h.length - 1] || {};
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const storeVal = storeFilter.value;
    const sortVal = document.getElementById('sortBy').value;
    const searchVal = document.getElementById('search').value.toLowerCase();

    let list = games.filter(g => {
      if (storeVal && g.store !== storeVal) return false;
      if (searchVal && !g.title.toLowerCase().includes(searchVal)) return false;
      return true;
    });

    list.sort((a, b) => {
      const la = latest(a), lb = latest(b);
      if (sortVal === 'discount') return (lb.discount_pct || 0) - (la.discount_pct || 0);
      if (sortVal === 'price') return (la.price || Infinity) - (lb.price || Infinity);
      return a.title.localeCompare(b.title);
    });

    document.getElementById('empty').style.display = list.length ? 'none' : 'block';

    list.forEach(g => {
      const l = latest(g);
      const card = document.createElement('div');
      card.className = 'card';

      const isLowest = g.lowest_price_ever !== null && l.price <= g.lowest_price_ever;

      card.innerHTML = `
        <span class="store">${g.store}</span>
        <h3>${g.title}</h3>
        ${l.discount_pct ? `<span class="badge">-${l.discount_pct}%</span>` : ''}
        ${isLowest ? `<span class="lowest-badge">Menor preço histórico</span>` : ''}
        <div class="price-row">
          <span class="price">R$ ${(l.price ?? 0).toFixed(2).replace('.', ',')}</span>
          ${l.original_price ? `<span class="original">R$ ${l.original_price.toFixed(2).replace('.', ',')}</span>` : ''}
        </div>
        <a class="buy" href="${g.url}" target="_blank" rel="noopener">Ver na loja</a>
      `;
      grid.appendChild(card);
    });
  }

  storeFilter.addEventListener('change', render);
  document.getElementById('sortBy').addEventListener('change', render);
  document.getElementById('search').addEventListener('input', render);

  render();
}

main().catch(err => {
  document.getElementById('empty').style.display = 'block';
  document.getElementById('empty').textContent = 'Erro ao carregar dados: ' + err.message;
});
</script>

</body>
</html>
