name: Atualizar preços Switch 2

on:
  schedule:
    # Todo dia às 09:00 (horário de Brasília = UTC-3) -> 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper
        run: python scraper.py

      - name: Commitar alterações
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "chore: atualiza preços ($(date -u +'%Y-%m-%d'))"
          git push
